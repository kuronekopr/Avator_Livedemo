<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalLogic AI Voice & RAG Avatar Chat</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts (Inter + Noto Sans JP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --primary-orange: #ff5f2d;
            --primary-orange-hover: #ff784d;
            --user-bubble-bg: linear-gradient(135deg, #3b82f6, #2563eb);
            --ai-bubble-bg: rgba(30, 41, 59, 0.85);
            --ai-bubble-border: rgba(139, 92, 246, 0.3);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ヘッダー */
        .chat-header {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: var(--primary-orange);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px rgba(255, 95, 45, 0.3);
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-header:hover {
            background: rgba(255, 95, 45, 0.2);
            border-color: var(--primary-orange);
            color: #ff8052;
        }

        .btn-reset-session {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .btn-reset-session:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ffffff;
        }

        /* チャットログエリア */
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* メッセージ行 */
        .message-row {
            display: flex;
            gap: 14px;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message-row.user .avatar {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .message-row.ai .avatar {
            background: linear-gradient(135deg, #ff5f2d, #d93800);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 95, 45, 0.4);
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
        }

        .message-row.user .bubble {
            background: var(--user-bubble-bg);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .message-row.ai .bubble {
            background: var(--ai-bubble-bg);
            border: 1px solid var(--ai-bubble-border);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .answer-text {
            white-space: pre-wrap;
        }

        /* 検索結果メタ情報 */
        .qa-meta {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .tag {
            background: rgba(255, 95, 45, 0.15);
            color: #ff8052;
            border: 1px solid rgba(255, 95, 45, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        .score-tag {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* 入力エリア */
        .input-container {
            padding: 16px 24px 20px;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid var(--panel-border);
        }

        .input-form {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 6px 8px 6px 16px;
            transition: all 0.2s ease;
        }

        .input-form:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 95, 45, 0.25);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
        }

        .input-field::placeholder {
            color: var(--text-sub);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .btn-mic {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .btn-mic:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-mic.recording {
            background: #ef4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-send {
            background: var(--primary-orange);
            color: white;
        }

        .btn-send:hover {
            background: var(--primary-orange-hover);
            transform: translateY(-1px);
        }

        .options-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 0 4px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .tts-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: flex;
        }

        .interrupted-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- ヘッダー -->
        <div class="chat-header">
            <div class="header-title">
                <div class="logo-badge">GlobalLogic</div>
                <h1>AI Voice & RAG Multi-turn Chat</h1>
            </div>
            <div class="header-right">
                <button class="btn-header btn-reset-session" onclick="triggerResetSession()" title="会話履歴を全リセット">
                    <i class="bi bi-trash3-fill"></i> セッション初期化
                </button>
                <button class="btn-header" onclick="triggerReindex()" title="QAデータを再読み込み">
                    <i class="bi bi-arrow-clockwise"></i> DB再読み込み
                </button>
            </div>
        </div>

        <!-- チャットログ -->
        <div class="chat-box" id="chat-box">
            <div class="message-row ai">
                <div class="avatar"><i class="bi bi-robot"></i></div>
                <div class="bubble">
                    こんにちは！GlobalLogic Japan AI アシスタントです。<br>
                    前の質問の文脈を引き継いで会話が可能です。お気軽にご質問ください。<br>
                    <span style="font-size: 12px; color: var(--text-sub);">※ 3分無操作がない場合、セッションは「ご利用ありがとうございました。」と自動終了されます。</span>
                </div>
            </div>
        </div>

        <!-- 入力フォーム -->
        <div class="input-container">
            <form id="chat-form" 
                  hx-post="/api/chat-ui" 
                  hx-target="#chat-box" 
                  hx-swap="beforeend"
                  class="input-form"
                  on-submit="stopSpeechSynthesis('user_submit')">

                <input type="text" 
                       id="query-input" 
                       name="query" 
                       class="input-field" 
                       placeholder="質問を入力するか、マイクボタンを押して喋ってください..." 
                       required 
                       autocomplete="off">

                <button type="button" id="mic-btn" class="btn-icon btn-mic" onclick="toggleSpeechRecognition()" title="音声入力 / 発話中断">
                    <i class="bi bi-mic-fill"></i>
                </button>

                <button type="submit" class="btn-icon btn-send" title="送信">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>

            <div class="options-bar">
                <label class="tts-toggle">
                    <input type="checkbox" id="tts-enabled" checked>
                    <span><i class="bi bi-volume-up"></i> 回答を自動音声読み上げ (Web Speech TTS)</span>
                </label>
                <span>Press Enter to send</span>
            </div>
        </div>
    </div>

    <script>
        let idleTimer = null;
        const THREE_MINUTES_MS = 3 * 60 * 1000; // 3分 (180,000ms)

        // 3分無操作タイマーのリセットと開始
        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                triggerResetSession(false, "3分間入力がなかったため、セッションを自動終了しました。");
            }, THREE_MINUTES_MS);
        }

        // 🛑 インタラプション (発話中断) 処理
        function stopSpeechSynthesis(reason = "user_interruption") {
            if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                console.log(`[Interruption] Speech Synthesis interrupted. Reason: ${reason}`);
                window.speechSynthesis.cancel();
            }
        }

        // セッション初期化処理
        async function triggerResetSession(manual = true, customMsg = null) {
            stopSpeechSynthesis("session_reset");
            if (idleTimer) clearTimeout(idleTimer);

            try {
                await fetch('/api/session/reset', { method: 'POST' });
                
                const chatBox = document.getElementById('chat-box');
                const messageText = customMsg || "ご利用ありがとうございました。";
                
                const sysHtml = `
                <div class="message-row ai">
                    <div class="avatar" style="background: linear-gradient(135deg, #64748b, #334155);"><i class="bi bi-door-closed-fill"></i></div>
                    <div class="bubble" style="border-color: #64748b; background: rgba(30, 41, 59, 0.9);">
                        <strong>${messageText}</strong><br>
                        <span style="font-size: 12px; color: #94a3b8;">会話履歴が初期化されました。新しい質問をお気軽にどうぞ！</span>
                    </div>
                </div>`;
                
                chatBox.insertAdjacentHTML('beforeend', sysHtml);
                chatBox.scrollTop = chatBox.scrollHeight;

                speakText(messageText);

            } catch (err) {
                console.error("セッション初期化エラー:", err);
            }
        }

        // DB再読み込み (POST /api/reindex)
        async function triggerReindex() {
            stopSpeechSynthesis("reindex");
            const btn = document.querySelector('.btn-header:not(.btn-reset-session)');
            btn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i> 処理中...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/reindex', { method: 'POST' });
                const data = await res.json();
                
                const chatBox = document.getElementById('chat-box');
                const sysHtml = `
                <div class="message-row ai">
                    <div class="avatar" style="background: #10b981;"><i class="bi bi-check-lg"></i></div>
                    <div class="bubble" style="border-color: #10b981;">
                        ✅ <strong>globallogic_qa.json の再インデックス完了</strong><br>
                        全 ${data.qa_count} 件のQAデータを ruri-v3 ベクトルDBへ登録しました。
                    </div>
                </div>`;
                chatBox.insertAdjacentHTML('beforeend', sysHtml);
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                alert("再読み込みエラー: " + err);
            } finally {
                btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> DB再読み込み';
                btn.disabled = false;
            }
        }

        // 音声合成 (TTS)
        function speakText(text) {
            stopSpeechSynthesis("new_speak");
            const ttsEnabled = document.getElementById('tts-enabled').checked;
            if (!ttsEnabled || !('speechSynthesis' in window)) return;

            const cleanText = text.replace(/<[^>]*>?/gm, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // HTMX イベントリスナー：リクエスト送信開始時に前回の読み上げをストップ
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            stopSpeechSynthesis("htmx_submit");
        });

        // HTMX イベントリスナー：レスポンス受信後処理
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.elt && evt.detail.elt.id === 'chat-form') {
                const input = document.getElementById('query-input');
                input.value = '';

                const chatBox = document.getElementById('chat-box');
                chatBox.scrollTop = chatBox.scrollHeight;

                const lastAiBubble = chatBox.querySelector('.message-row.ai:last-child .answer-text');
                if (lastAiBubble) {
                    speakText(lastAiBubble.innerText);
                }

                resetIdleTimer();
            }
        });

        // 初期タイマーの起動
        resetIdleTimer();

        // Web Speech API (音声入力 & インタラプション)
        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRecording = true;
                // 🛑 マイク入力（発話開始）された瞬間にAIの説明・読み上げを即座にストップ
                stopSpeechSynthesis("mic_start_interruption");

                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.add('recording');
                micBtn.innerHTML = '<i class="bi bi-stop-fill"></i>';
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('query-input').value = transcript;
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error:", event.error);
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };
        } else {
            console.warn("Speech Recognition API is not supported in this browser.");
            document.getElementById('mic-btn').style.display = 'none';
        }

        function toggleSpeechRecognition() {
            // 音声ボタンが押された瞬間に、AIの回答再生を即座にストップ（インタラプション）
            stopSpeechSynthesis("mic_button_clicked");

            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopRecording() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) {
                micBtn.classList.remove('recording');
                micBtn.innerHTML = '<i class="bi bi-mic-fill"></i>';
            }
        }
    </script>
</body>
</html>
